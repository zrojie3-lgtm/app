name: Build Android APK and Publish

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Create debug keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        mkdir -p ~/.android
        cp debug.keystore ~/.android/debug.keystore

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace || gradle assembleDebug --stacktrace

    - name: Prepare APK Files
      run: |
        mkdir -p apk
        cp app/build/outputs/apk/debug/*.apk apk/app-latest.apk

    - name: Commit and Push APK directly into Repo
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add apk/app-latest.apk
        git commit -m "Auto-update: Latest APK build" || echo "No changes to commit"
        git push origin HEAD:${{ github.ref_name }}

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: apk/app-latest.apk
        tag_name: "v${{ github.run_number }}"
        name: "Release v${{ github.run_number }}"
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Create debug keystore
      run: |
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Build Debug APK
      run: gradle assembleDebug --stacktrace

    - name: Create releases folder and move APK
      run: |
        mkdir -p releases
        cp app/build/outputs/apk/debug/*.apk releases/app-debug.apk

    - name: Commit and push APK to repository
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "Auto-update built APK [skip ci]"
        file_pattern: "releases/*.apk"
